## @param customName allows to set a custom resource name for the K8S resources in the charts
##        Defaults to {{.Release.name}}-{{ .Chart.Name}}
customName: ''

## @param replicatCount Number of Nginx
replicaCount: 3

## Setting for NGINX image
## @param image.name Nginx image name to use
## @param image.tag Nginx image tag to use

image:
  name: nginx
  tag: 1.27.0

## Setting for NGINX image securityContext
## @param securityContext.runAsUser
## @param securityContext.fsGroup 
securityContext:
  enabled: true
  runAsUser: 1000
  fsGroup: 2000


## NGINX container ports
##
## @param containerPorts.http
containerPorts:
  http: 80

## Setting for NGINX services
##
##
## @param services["*"].type the type of service in front of the Nginx pods
## @param services["*"].port the port where the service is receiving requests

services:
  svc1:
    type: ClusterIP
    port: 80
  svc2:
    type: NodePort
    port: 30007

    